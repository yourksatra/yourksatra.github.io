<!-- tabel.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pengeluaran</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
    <h2>Data Pengeluaran</h2>
    
    <!-- Filter Tahun & Bulan -->
    <div class="d-flex gap-2 mb-3">
        <select id="tahun" class="form-select w-auto">
            <option value="2025">2025</option>
            <option value="2024">2024</option>
        </select>
        <select id="bulan" class="form-select w-auto">
            <option value="01">Januari</option>
            <option value="02">Februari</option>
        </select>
    </div>
    
    <!-- Tabel Pengeluaran -->
    <table class="table table-bordered text-center">
        <thead>
            <tr>
                <th>Tanggal</th>
                <th>Kategori</th>
                <th>Deskripsi</th>
                <th>Jumlah</th>
            </tr>
        </thead>
        <tbody id="tabel-body">
            <tr>
                <td colspan="4">Memuat data...</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="3" class="text-end">Total:</th>
                <th id="total-pengeluaran">Rp 0</th>
            </tr>
        </tfoot>
    </table>
    
    <button id="btnDownload" class="btn btn-success">Download CSV</button>
    <a href="https://yourksatra.github.io/moneynote" class="btn btn-secondary">Kembali</a>
    
    <script src="js/scripts.js" type="module"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            function fetchData() {
                let tahun = document.getElementById("tahun").value;
                let bulan = document.getElementById("bulan").value;
                loadPengeluaran(tahun, bulan);
            }
            
            document.getElementById("tahun").addEventListener("change", fetchData);
            document.getElementById("bulan").addEventListener("change", fetchData);
            
            fetchData();
        });
    </script>
</body>
</html>
