<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pengeluaran</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        
       const firebaseConfig = {
          apiKey: "AIzaSyAIN63oj7OWScZ5kV0G7MxQL1bq3rgGcF0",
          authDomain: "webmoneynote.firebaseapp.com",
          projectId: "webmoneynote",
          storageBucket: "webmoneynote.firebasestorage.app",
          messagingSenderId: "916249252817",
          appId: "1:916249252817:web:7359ed42699da26e60c6f0",
          measurementId: "G-732CV0099G"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        async function tampilkanData() {
            const querySnapshot = await getDocs(collection(db, "pengeluaran"));
            let dataHTML = "";
            let totalPengeluaran = 0;
            
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                dataHTML += `<tr><td>${data.tanggal}</td><td>${data.kategori}</td><td>${data.jumlah}</td><td>${data.deskripsi}</td></tr>`;
                totalPengeluaran += parseFloat(data.jumlah);
            });
            
            document.getElementById("data-body").innerHTML = dataHTML;
            document.getElementById("total-pengeluaran").innerText = `Total: Rp ${totalPengeluaran}`;
        }
        
        async function downloadCSV() {
            let csv = "Tanggal,Kategori,Jumlah,Deskripsi\n";
            const querySnapshot = await getDocs(collection(db, "pengeluaran"));
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                csv += `${data.tanggal},${data.kategori},${data.jumlah},${data.deskripsi}\n`;
            });
            
            const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            saveAs(blob, "pengeluaran.csv");
        }
        
        document.addEventListener("DOMContentLoaded", tampilkanData);
    </script>
</head>
<body class="container py-4">
    <h2>Data Pengeluaran</h2>
    <button class="btn btn-success mb-2" onclick="downloadCSV()">Download CSV</button>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Tanggal</th>
                <th>Kategori</th>
                <th>Jumlah</th>
                <th>Deskripsi</th>
            </tr>
        </thead>
        <tbody id="data-body"></tbody>
        <tfoot>
            <tr>
                <td colspan="3"><strong id="total-pengeluaran"></strong></td>
            </tr>
        </tfoot>
    </table>
    <a href="https://yourksatra.github.io/moneynote" class="btn btn-secondary">Kembali ke Input</a>
</body>
</html>
