<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pengeluaran</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
    <h2>Data Pengeluaran</h2>
    <!-- Filter Tahun & Bulan -->
    <div class="d-flex gap-2 mb-3">
        <select id="tahun" class="form-select w-auto">
            <option disabled selected>Pilih Tahun</option>
        </select>
        <select id="bulan" class="form-select w-auto">
            <option disabled selected>Pilih Bulan</option>
        </select>
    </div>
    
    <!-- Tabel Pengeluaran -->
    <table class="table table-bordered text-center">
        <thead>
            <tr>
                <th>Tanggal</th>
                <th>Kategori</th>
                <th>Deskripsi</th>
                <th>Jumlah</th>
            </tr>
        </thead>
        <tbody id="tabel-body">
            <tr>
                <td colspan="4">Memuat data...</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="3" class="text-end">Total:</th>
                <th id="total-pengeluaran">Rp 0</th>
            </tr>
        </tfoot>
    </table>
    
    <a href="https://yourksatra.github.io/moneynote" class="btn btn-secondary">Kembali</a>
    <button id="downloadCSV" class="btn btn-success">Download CSV</button>
</body>

</html>
