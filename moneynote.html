<!-- input.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Pengeluaran</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="container py-4">
    <h2>Input Pengeluaran</h2>
    <form id="pengeluaranForm">
        <input type="date" id="tanggal" class="form-control mb-2" required>
        <select id="kategori" class="form-select mb-2" onchange="toggleKategoriInput()">
                    <option disable selected>Pilih Kategori</option>
                    <option value="Makan">Makan</option>
                    <option value="Transportasi">Transportasi</option>
                    <option value="Belanja">Belanja</option>
                    <option value="Hiburan">Hiburan</option>
                    <option value="custom">Lainnya (Isi Manual)</option>
                </select>
                <input type="text" id="kategoriManual" class="form-control mt-2 d-none" placeholder="Masukkan Kategori">
            </div>
        <input type="text" id="jumlah" class="form-control mb-2" placeholder="Jumlah (Rp)" required>
        <textarea id="deskripsi" class="form-control mb-2" placeholder="Deskripsi"></textarea>
        <button type="reset" class="btn btn-warning">Reset</button>
        <button type="submit" class="btn btn-primary">Simpan</button>
        <a type="button" href="https://yourksatra.github.io/moneytabel" class="btn btn-secondary">Lihat Data</a>
    </form>
    <script src="js/scripts.js" type="module"></script>
    <script>
        document.getElementById("jumlah").addEventListener("input", function(event) {
            let value = event.target.value.replace(/\D/g, "");
            event.target.value = new Intl.NumberFormat("id-ID").format(value);
        });

        function toggleKategoriInput() {
            let kategori = document.getElementById("kategori").value;
            let kategoriManual = document.getElementById("kategoriManual");
            if (kategori === "custom") {
                kategoriManual.classList.remove("d-none");
            } else {
                kategoriManual.classList.add("d-none");
                kategoriManual.value = "";
            }
        }
    </script>
</body>
</html>
