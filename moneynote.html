<!-- Halaman Input (input.html) -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Pengeluaran</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        
        const firebaseConfig = {
          apiKey: "AIzaSyAIN63oj7OWScZ5kV0G7MxQL1bq3rgGcF0",
          authDomain: "webmoneynote.firebaseapp.com",
          projectId: "webmoneynote",
          storageBucket: "webmoneynote.firebasestorage.app",
          messagingSenderId: "916249252817",
          appId: "1:916249252817:web:7359ed42699da26e60c6f0",
          measurementId: "G-732CV0099G"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        async function simpanPengeluaran() {
            const tanggal = document.getElementById("tanggal").value;
            const kategori = document.getElementById("kategori").value;
            const jumlah = document.getElementById("jumlah").value;
            const deskripsi = document.getElementById("deskripsi").value;
            
            try {
                await addDoc(collection(db, "pengeluaran"), { tanggal, kategori, jumlah, deskripsi });
                Swal.fire("Sukses", "Data berhasil disimpan", "success");
            } catch (e) {
                Swal.fire("Error", "Gagal menyimpan data", "error");
            }
        }
    </script>
</head>
<body class="container py-4">
    <h2>Input Pengeluaran</h2>
    <form onsubmit="event.preventDefault(); simpanPengeluaran();">
        <input type="date" id="tanggal" class="form-control mb-2" required>
        <input type="text" id="kategori" class="form-control mb-2" placeholder="Kategori" required>
        <input type="number" id="jumlah" class="form-control mb-2" placeholder="Jumlah" required>
        <textarea id="deskripsi" class="form-control mb-2" placeholder="Deskripsi"></textarea>
        <button type="submit" class="btn btn-primary">Simpan</button>
    </form>
    <a href="tabel.html" class="btn btn-secondary mt-3">Lihat Data</a>
</body>
</html>
