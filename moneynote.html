<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencatatan Pengeluaran</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { margin: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4">Pencatatan Pengeluaran</h2>
        <div class="row mb-3">
            <div class="col-md-3">
                <label class="form-label">Tanggal:</label>
                <input type="date" id="tanggal" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label">Kategori:</label>
                <select id="kategori" class="form-select" onchange="toggleKategoriInput()">
                    <option value="Makan">Makan</option>
                    <option value="Transportasi">Transportasi</option>
                    <option value="Belanja">Belanja</option>
                    <option value="Hiburan">Hiburan</option>
                    <option value="Lainnya">Lainnya</option>
                    <option value="custom">Lainnya (Isi Manual)</option>
                </select>
                <input type="text" id="kategoriManual" class="form-control mt-2 d-none" placeholder="Masukkan kategori">
            </div>
            <div class="col-md-2">
                <label class="form-label">Jumlah (Rp):</label>
                <input type="number" id="jumlah" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">Deskripsi:</label>
                <input type="text" id="deskripsi" class="form-control">
            </div>
        </div>
        <button class="btn btn-primary" onclick="tambahPengeluaran()">Tambah</button>
        <button class="btn btn-success" onclick="downloadCSV()">Download CSV</button>
        
        <div class="mt-4">
            <label class="form-label">Filter Tahun:</label>
            <select id="filterTahun" class="form-select" onchange="filterData()"></select>
        </div>

        <table class="table table-bordered table-striped mt-3">
            <thead>
                <tr>
                    <th>Tanggal</th>
                    <th>Kategori</th>
                    <th>Jumlah</th>
                    <th>Deskripsi</th>
                </tr>
            </thead>
            <tbody id="tabelPengeluaran"></tbody>
            <tfoot>
                <tr>
                    <td colspan="2"><strong>Total Bulan Ini:</strong></td>
                    <td id="totalPengeluaran">Rp. 0</td>
                    <td></td>
                </tr>
            </tfoot>
        </table>
    </div>

    <script>
        let dataPengeluaran = [];

        function toggleKategoriInput() {
            let kategori = document.getElementById("kategori").value;
            let kategoriManual = document.getElementById("kategoriManual");
            if (kategori === "custom") {
                kategoriManual.classList.remove("d-none");
            } else {
                kategoriManual.classList.add("d-none");
                kategoriManual.value = "";
            }
        }

        function tambahPengeluaran() {
            let tanggal = document.getElementById("tanggal").value;
            let kategori = document.getElementById("kategori").value;
            let kategoriManual = document.getElementById("kategoriManual").value;
            let jumlah = document.getElementById("jumlah").value;
            let deskripsi = document.getElementById("deskripsi").value;

            if (kategori === "custom") kategori = kategoriManual;

            if (tanggal && jumlah) {
                dataPengeluaran.push([tanggal, kategori, jumlah, deskripsi]);
                updateTabel();
            }
        }

        function updateTabel() {
            let tbody = document.getElementById("tabelPengeluaran");
            tbody.innerHTML = "";
            let total = 0;
            dataPengeluaran.forEach(row => {
                let tr = document.createElement("tr");
                row.forEach(col => {
                    let td = document.createElement("td");
                    td.textContent = col;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
                total += parseFloat(row[2]);
            });
            document.getElementById("totalPengeluaran").textContent = `Rp. ${total.toLocaleString("id-ID")}`;
        }

        function downloadCSV() {
            let csvContent = "data:text/csv;charset=utf-8,Tanggal,Kategori,Jumlah,Deskripsi\n" +
                dataPengeluaran.map(e => e.join(",")).join("\n");
            let encodedUri = encodeURI(csvContent);
            let link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "pengeluaran.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
